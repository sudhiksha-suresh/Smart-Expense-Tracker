<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Smart Expense Tracker</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f7f6;--card:#fff;--text:#14211d;--muted:#5d6d68;--line:#dfe6e3;--accent:#0f766e;--accent2:#14b8a6;--warn:#d97706;--bad:#dc2626;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1513;--card:#16201d;--text:#e8f0ed;--muted:#92a39d;--line:#27352f;--accent:#2dd4bf;--accent2:#0f766e;--warn:#fbbf24;--bad:#f87171;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1513;--card:#16201d;--text:#e8f0ed;--muted:#92a39d;--line:#27352f;--accent:#2dd4bf;--accent2:#0f766e;--warn:#fbbf24;--bad:#f87171;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*:before,*:after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:20px}
h1{font-size:22px;margin:0}h1 span{color:var(--accent)}
h2{font-size:15px;margin:0 0 12px}
.sub{color:var(--muted);font-size:13px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;gap:16px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media(max-width:820px){.c4,.c5,.c6,.c7,.c8{grid-column:span 12}}
.kpi{font-size:26px;font-weight:700;margin-top:2px}
input,select,button{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:1px}
button{cursor:pointer}button.primary{background:var(--accent);color:#04201c;border-color:var(--accent);font-weight:600}
button.ghost{background:transparent}
form{display:grid;grid-template-columns:1fr 1fr;gap:10px}form .full{grid-column:1/-1}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
form input,form select{width:100%}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.b{margin-bottom:14px}.b .top{display:flex;justify-content:space-between;gap:8px;font-size:13px}
.b input{width:84px;padding:3px 6px;font-size:12px;text-align:right}
.chart{position:relative;height:250px}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:500;font-size:12px}
td.amt{text-align:right;font-variant-numeric:tabular-nums}
.tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;border:1px solid var(--line)}
.x{background:none;border:none;color:var(--muted);padding:2px 6px}
.empty{color:var(--muted);padding:16px 0;text-align:center}
.alert{font-size:13px;padding:8px 10px;border-radius:9px;border:1px solid var(--warn);color:var(--warn);margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div><h1>Smart <span>Expense</span> Tracker</h1><div class="sub">Record, categorize and understand your spending</div></div>
    <div class="row">
      <input type="month" id="month" aria-label="Month">
      <button class="ghost" id="theme" title="Toggle theme">◐</button>
      <button class="ghost" id="reset">Load demo data</button><button class="ghost" id="clear">Clear all data</button>
    </div>
  </header>

  <div class="grid">
    <div class="card c4"><div class="sub">Spent this month</div><div class="kpi" id="kSpent">₹0</div><div class="sub" id="kSpentSub"></div></div>
    <div class="card c4"><div class="sub">Total budget</div><div class="kpi" id="kBudget">₹0</div><div class="sub" id="kBudgetSub"></div></div>
    <div class="card c4"><div class="sub">Top category</div><div class="kpi" id="kTop">—</div><div class="sub" id="kTopSub"></div></div>

    <div class="card c5">
      <h2>Add expense</h2>
      <form id="f">
        <div><label for="amt">Amount (₹)</label><input id="amt" type="number" min="1" step="0.01" required></div>
        <div><label for="cat">Category</label><select id="cat"></select></div>
        <div><label for="date">Date</label><input id="date" type="date" required></div>
        <div><label for="note">Note</label><input id="note" type="text" maxlength="60" placeholder="optional"></div>
        <button class="primary full" type="submit" id="sub">Add expense</button><button class="ghost full" type="button" id="cancel" hidden>Cancel edit</button>
      </form>
    </div>

    <div class="card c7">
      <h2>Budgets vs. spending</h2>
      <div id="budgets"></div>
      <div id="alerts"></div>
    </div>

    <div class="card c7"><h2>Monthly spending trend</h2><div class="chart"><canvas id="trend"></canvas></div></div>
    <div class="card c5"><h2>By category</h2><div class="chart"><canvas id="pie"></canvas></div></div>

    <div class="card c12">
      <div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">Transactions</h2>
        <select id="filter" aria-label="Filter category"></select></div>
      <div class="scroll"><table><thead><tr><th>Date</th><th>Category</th><th>Note</th><th style="text-align:right">Amount</th><th></th></tr></thead><tbody id="rows"></tbody></table></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
const CATS=[["Food","#f59e0b"],["Transport","#3b82f6"],["Shopping","#ec4899"],["Bills","#8b5cf6"],["Health","#10b981"],["Entertainment","#ef4444"],["Other","#64748b"]];
const COLOR=Object.fromEntries(CATS);
const DEF_BUDGET={Food:8000,Transport:3000,Shopping:5000,Bills:10000,Health:2000,Entertainment:3000,Other:2000};
const KEY="set:v1";
const $=id=>document.getElementById(id);
const inr=n=>"₹"+Math.round(n).toLocaleString("en-IN");
let state=load();
let trendChart,pieChart,editId=null;

function seed(){
  const out=[],now=new Date(),notes={Food:["Groceries","Lunch","Dinner out","Coffee"],Transport:["Metro","Cab","Fuel"],Shopping:["Clothes","Gadget"],Bills:["Electricity","Internet","Rent share"],Health:["Pharmacy","Gym"],Entertainment:["Movie","Streaming"],Other:["Misc"]};
  let s=7;const rnd=()=>(s=(s*9301+49297)%233280)/233280;
  for(let m=5;m>=0;m--){
    for(let i=0;i<14;i++){
      const c=CATS[Math.floor(rnd()*CATS.length)][0];
      const d=new Date(now.getFullYear(),now.getMonth()-m,1+Math.floor(rnd()*27));
      if(m===0&&d>now)continue;
      const base={Food:450,Transport:300,Shopping:1400,Bills:1800,Health:600,Entertainment:500,Other:300}[c];
      out.push({id:crypto.randomUUID?crypto.randomUUID():String(Math.random()),amount:Math.round(base*(0.5+rnd()*1.2)),cat:c,date:iso(d),note:notes[c][Math.floor(rnd()*notes[c].length)]});
    }
  }
  return {expenses:out,budgets:{...DEF_BUDGET}};
}
function iso(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function load(){try{const r=localStorage.getItem(KEY);if(r)return JSON.parse(r)}catch(e){}return seed()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}

function monthExp(){return state.expenses.filter(e=>e.date.startsWith($("month").value))}
function sumBy(list){const o={};CATS.forEach(([c])=>o[c]=0);list.forEach(e=>o[e.cat]=(o[e.cat]||0)+e.amount);return o}

function render(){
  const list=monthExp(),by=sumBy(list),total=list.reduce((a,e)=>a+e.amount,0);
  const tb=Object.values(state.budgets).reduce((a,b)=>a+b,0);
  $("kSpent").textContent=inr(total);
  $("kSpentSub").textContent=list.length+" transactions";
  $("kBudget").textContent=inr(tb);
  const left=tb-total;
  $("kBudgetSub").textContent=left>=0?inr(left)+" left":inr(-left)+" over budget";
  const top=Object.entries(by).sort((a,b)=>b[1]-a[1])[0];
  $("kTop").textContent=top&&top[1]>0?top[0]:"—";
  $("kTopSub").textContent=top&&top[1]>0?inr(top[1])+" ("+Math.round(top[1]/total*100)+"%)":"No data yet";

  // budgets
  $("budgets").innerHTML="";const alerts=[];
  CATS.forEach(([c,col])=>{
    const sp=by[c]||0,bd=state.budgets[c]||0,pct=bd?sp/bd*100:0;
    const d=document.createElement("div");d.className="b";
    d.innerHTML=`<div class="top"><span><b>${c}</b> · ${inr(sp)} of</span><input type="number" min="0" value="${bd}" data-c="${c}" aria-label="${c} budget"></div><div class="bar"><i style="width:${Math.min(pct,100)}%;background:${pct>100?"var(--bad)":pct>80?"var(--warn)":col}"></i></div>`;
    $("budgets").appendChild(d);
    if(pct>100)alerts.push(`${c} is over budget by ${inr(sp-bd)}.`);else if(pct>80)alerts.push(`${c} has used ${Math.round(pct)}% of its budget.`);
  });
  $("alerts").innerHTML=alerts.map(a=>`<div class="alert">⚠ ${a}</div>`).join("");
  document.querySelectorAll("#budgets input").forEach(i=>i.onchange=()=>{state.budgets[i.dataset.c]=Math.max(0,+i.value||0);save();render()});

  // table
  const f=$("filter").value,rows=list.filter(e=>f==="All"||e.cat===f).sort((a,b)=>b.date.localeCompare(a.date));
  $("rows").innerHTML=rows.length?rows.map(e=>`<tr><td>${e.date}</td><td><span class="tag" style="border-color:${COLOR[e.cat]};color:${COLOR[e.cat]}">${e.cat}</span></td><td>${esc(e.note)}</td><td class="amt">${inr(e.amount)}</td><td><button class="x ed" data-id="${e.id}" aria-label="Edit">Edit</button><button class="x del" data-id="${e.id}" aria-label="Delete">✕</button></td></tr>`).join(""):`<tr><td colspan="5" class="empty">No expenses for this selection.</td></tr>`;
  document.querySelectorAll(".del").forEach(b=>b.onclick=()=>{state.expenses=state.expenses.filter(e=>e.id!==b.dataset.id);if(editId===b.dataset.id)stopEdit();save();render()});
  document.querySelectorAll(".ed").forEach(b=>b.onclick=()=>{const e=state.expenses.find(x=>x.id===b.dataset.id);if(!e)return;editId=e.id;$("amt").value=e.amount;$("cat").value=e.cat;$("date").value=e.date;$("note").value=e.note||"";$("sub").textContent="Save changes";$("cancel").hidden=false;$("f").scrollIntoView({behavior:"smooth",block:"center"})});

  charts(by);
}
function stopEdit(){editId=null;$("sub").textContent="Add expense";$("cancel").hidden=true;$("amt").value="";$("note").value=""}
function esc(s){return (s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function charts(by){
  if(typeof Chart==="undefined")return;
  const css=getComputedStyle(document.documentElement),muted=css.getPropertyValue("--muted").trim(),line=css.getPropertyValue("--line").trim(),acc=css.getPropertyValue("--accent").trim();
  // trend: last 6 months ending selected month
  const [y,m]=$("month").value.split("-").map(Number),labels=[],vals=[];
  for(let i=5;i>=0;i--){const d=new Date(y,m-1-i,1),k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
    labels.push(d.toLocaleString("en",{month:"short"}));vals.push(state.expenses.filter(e=>e.date.startsWith(k)).reduce((a,e)=>a+e.amount,0))}
  const tb=Object.values(state.budgets).reduce((a,b)=>a+b,0);
  if(trendChart)trendChart.destroy();if(pieChart)pieChart.destroy();
  trendChart=new Chart($("trend"),{type:"bar",data:{labels,datasets:[{label:"Spent",data:vals,backgroundColor:acc,borderRadius:6},{type:"line",label:"Budget",data:labels.map(()=>tb),borderColor:"#f59e0b",borderDash:[6,4],pointRadius:0}]},
    options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:muted}}},scales:{x:{ticks:{color:muted},grid:{display:false}},y:{ticks:{color:muted,callback:v=>"₹"+v/1000+"k"},grid:{color:line}}}}});
  const ent=CATS.filter(([c])=>by[c]>0);
  pieChart=new Chart($("pie"),{type:"doughnut",data:{labels:ent.map(e=>e[0]),datasets:[{data:ent.map(e=>by[e[0]]),backgroundColor:ent.map(e=>e[1]),borderWidth:0}]},
    options:{responsive:true,maintainAspectRatio:false,cutout:"62%",plugins:{legend:{position:"bottom",labels:{color:muted,boxWidth:12}}}}});
}

// init
(function(){
  const now=new Date();
  $("month").value=iso(now).slice(0,7);$("date").value=iso(now);
  $("cat").innerHTML=CATS.map(([c])=>`<option>${c}</option>`).join("");
  $("filter").innerHTML="<option>All</option>"+CATS.map(([c])=>`<option>${c}</option>`).join("");
  $("month").onchange=render;$("filter").onchange=render;
  $("f").onsubmit=ev=>{ev.preventDefault();
    const a=+$("amt").value;if(!(a>0))return;
    const rec={amount:a,cat:$("cat").value,date:$("date").value,note:$("note").value.trim()};
    if(editId){const t=state.expenses.find(x=>x.id===editId);if(t)Object.assign(t,rec);stopEdit()}
    else state.expenses.push({id:crypto.randomUUID?crypto.randomUUID():String(Math.random()),...rec});
    if($("date").value.slice(0,7)!==$("month").value)$("month").value=$("date").value.slice(0,7);
    $("amt").value="";$("note").value="";save();render()};
  $("reset").onclick=()=>{state=seed();stopEdit();save();render()};
  $("clear").onclick=()=>{state.expenses=[];stopEdit();save();render()};
  $("cancel").onclick=stopEdit;
  $("theme").onclick=()=>{const r=document.documentElement,dark=getComputedStyle(r).colorScheme==="dark";r.dataset.theme=dark?"light":"dark";render()};
  render();
})();
</script>
</body>
</html>
